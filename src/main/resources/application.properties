server.port=${PORT:8080}
spring.profiles.active=@springProfiles@
spring.jpa.open-in-view=false

# Behind Dokku's nginx the app must trust X-Forwarded-* headers; otherwise {baseUrl} in the
# OAuth redirect URIs below resolves to http:// instead of https:// and Google rejects it.
server.forward-headers-strategy=framework

# For properties defined with
#    var=${SYMBOL:${env.SYMBOL:default}}
# SYMBOL on the left of the first : is a real environment variable (e.g. a Dokku config var),
# env.SYMBOL on the right is a value from a .env file (via the spring-dotenv dependency).

# ---------------------------------------------------------------------------------------------
# Registration #1: "google" -- used by EVERYONE to log in. Only basic scopes; no Gmail access.
# ---------------------------------------------------------------------------------------------
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:${env.GOOGLE_CLIENT_ID:client_id_unset}}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:${env.GOOGLE_CLIENT_SECRET:client_secret_unset}}
spring.security.oauth2.client.registration.google.scope=email,profile

# ---------------------------------------------------------------------------------------------
# Registration #2: "gmail" -- used ONLY by an admin who chooses to authorize sending email.
# Same Google OAuth client (same id and secret), different scopes and a different redirect URI.
#   * "email" lets us confirm which Google account the admin actually authorized.
#   * gmail.send is the narrowest Gmail scope that can send mail (it cannot read mail).
# The redirect URI must NOT be under /login/oauth2/code/ (that path belongs to the login flow).
# ---------------------------------------------------------------------------------------------
spring.security.oauth2.client.registration.gmail.provider=google
spring.security.oauth2.client.registration.gmail.client-name=Gmail (send only)
spring.security.oauth2.client.registration.gmail.client-id=${GOOGLE_CLIENT_ID:${env.GOOGLE_CLIENT_ID:client_id_unset}}
spring.security.oauth2.client.registration.gmail.client-secret=${GOOGLE_CLIENT_SECRET:${env.GOOGLE_CLIENT_SECRET:client_secret_unset}}
spring.security.oauth2.client.registration.gmail.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.gmail.redirect-uri={baseUrl}/authorized/gmail
spring.security.oauth2.client.registration.gmail.scope=email,https://www.googleapis.com/auth/gmail.send

# Comma separated, NO spaces
app.admin.emails=${ADMIN_EMAILS:${env.ADMIN_EMAILS:phtcon@ucsb.edu}}

# The schema is managed by Liquibase, not Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.liquibase.change-log=db/migration/changelog-master.json
